<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity</title>
<style>
  :root {
    --bg: #050505; --panel: #111; 
    --text: #eee; --muted: #888;
    --board: #1a1a1a; --line: #333;
    --stone-b: #111; --stone-w: #ddd;
    --amber: #E3B04B; 
  }
  * { box-sizing: border-box; }
  body { 
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .app { max-width: 900px; margin: 0 auto; padding: 30px 20px; display: grid; gap: 40px; }
  @media(min-width: 800px) { .app { grid-template-columns: minmax(0, 500px) 1fr; align-items: start; } }

  .board-col { display: flex; flex-direction: column; gap: 16px; }
  .title { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: 1px; }
  
  .board {
    position: relative; width: 100%; aspect-ratio: 1; 
    background: var(--board); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); }
  .cell { border: 1px solid var(--line); position: relative; }
  .cell.empty { cursor: pointer; }
  .cell.empty:hover { background: rgba(255,255,255,0.05); }
  .cell.hinted { background: rgba(227,176,75,0.2); box-shadow: inset 0 0 0 2px var(--amber); }
  .board.over .cell { cursor: default; }
  
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .stone, .ghost {
    position: absolute; width: 11.1111%; height: 11.1111%; display: flex; align-items: center; justify-content: center;
    transition: left .38s cubic-bezier(.2,.8,.2,1), top .38s cubic-bezier(.2,.8,.2,1), opacity .2s;
  }
  .stone.wrap-clone { z-index: 5; } /* 벽 통과 애니메이션용 클론 */
  
  .disc { width: 76%; height: 76%; border-radius: 50%; box-shadow: 0 3px 6px rgba(0,0,0,.6); transition: transform .2s, opacity .2s; }
  .stone.black .disc { background: radial-gradient(circle at 35% 30%, #444, var(--stone-b) 60%); border: 1px solid #222; }
  .stone.white .disc { background: radial-gradient(circle at 35% 30%, #fff, var(--stone-w) 65%); }
  .stone.new .disc { transform: scale(.3); opacity: 0; }
  .stone.top .disc { box-shadow: 0 0 0 2px var(--amber), 0 3px 6px rgba(0,0,0,.6); }
  .stone.will-move .disc { opacity: .45; transform: scale(.92); }
  .board.over .stone:not(.top) .disc { opacity: .35; }
  
  .ghost .disc { opacity: .4; box-shadow: 0 0 0 2px var(--amber); }
  .ghost.black .disc { background: var(--stone-b); } 
  .ghost.white .disc { background: var(--stone-w); }
  .ghost.place .disc { opacity: .7; box-shadow: 0 0 0 2px var(--amber); }

  .status-panel { display: flex; justify-content: space-between; align-items: flex-end; }
  .turn-info { font-size: 20px; font-weight: bold; }
  .winrate { font-size: 14px; color: var(--amber); font-weight: 600; min-height: 21px; }
  
  .panel { display: flex; flex-direction: column; gap: 24px; }
  
  .score-box { display: flex; gap: 20px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: 18px; font-weight: bold; }
  .score-box div { flex: 1; text-align: center; }
  .score-box span { font-size: 24px; margin-left: 8px; }
  
  .controls { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .row > span { width: 70px; color: var(--muted); font-size: 14px; }
  
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: #000; }
  .seg button { background: transparent; border: 0; padding: 7px 14px; font-size: 14px; color: #888; }
  .seg button:not(:first-child) { border-left: 1px solid var(--line); }
  .seg button.on { background: #333; color: #fff; font-weight: bold; }
  
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .btn { background: #1a1a1a; border: 1px solid var(--line); color: #eee; padding: 10px; border-radius: 4px; font-weight: 600; }
  .btn:hover:not(:disabled) { background: #2a2a2a; }
  .btn.primary { background: #fff; color: #000; }
  .btn.primary:hover:not(:disabled) { background: #ddd; }
  .btn:disabled { opacity: 0.3; cursor: default; }

  details { font-size: 14px; color: var(--muted); background: var(--panel); padding: 12px; border-radius: 6px; border: 1px solid var(--line); }
  details summary { cursor: pointer; color: var(--text); font-weight: bold; }
  details ul { padding-left: 20px; margin: 10px 0 0; }
  details li { margin-bottom: 6px; }
</style>
</head>
<body>
<div class="app">
  <div class="board-col">
    <h1 class="title">Gravity</h1>
    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="layer" id="ghosts"></div>
      <div class="layer" id="stones"></div>
    </div>
    <div class="status-panel">
      <div>
        <div id="turnBox" class="turn-info"></div>
        <div style="font-size:13px; color:#666; margin-top:4px;" id="stonesPlaced"></div>
      </div>
      <div id="winRateBox" class="winrate"></div>
    </div>
  </div>

  <div class="panel">
    <div class="score-box">
      <div style="color: #fff;">흑 최대 무리 <span id="scoreB">0</span></div>
      <div style="color: #ccc;">백 최대 무리 <span id="scoreW">0</span></div>
    </div>

    <div class="controls">
      <div class="row">
        <span>진행 방식</span>
        <div class="seg" id="typeSeg">
          <button data-v="play" class="on">플레이</button>
          <button data-v="training">훈련</button>
        </div>
      </div>
      <div class="row">
        <span>상대</span>
        <div class="seg" id="modeSeg">
          <button data-v="ai" class="on">AI</button>
          <button data-v="local">2인</button>
        </div>
      </div>
      <div class="row" id="levelRow">
        <span>AI 난이도</span>
        <div class="seg" id="levelSeg">
          <button data-v="1">1단계</button>
          <button data-v="2" class="on">2단계</button>
          <button data-v="3">3단계</button>
          <button data-v="4">4단계</button>
        </div>
      </div>
      <div class="row" id="colorRow">
        <span>내 돌</span>
        <div class="seg" id="colorSeg">
          <button data-v="1" class="on">흑 (선공)</button>
          <button data-v="2">백</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="newBtn">새 게임</button>
      <button class="btn" id="resignBtn">기권</button>
      <button class="btn" id="undoBtn" style="display:none;">무르기</button>
      <button class="btn" id="hintBtn" style="display:none;">힌트 보기</button>
    </div>

    <details>
      <summary>게임 규칙 (9x9 환상형)</summary>
      <ul>
        <li>번갈아 빈 칸에 돌을 하나 놓습니다. 흑(선공)이 먼저 둡니다.</li>
        <li>보드의 끝과 끝은 연결되어 있습니다. 이 우주에는 '가운데'나 '구석'이 존재하지 않습니다.</li>
        <li>놓은 돌은 중력을 내어 상하좌우(반대편 화면 너머 포함) 가장 가까운 돌들을 자신에게 끌어당깁니다.</li>
        <li>80칸이 채워지면 게임이 종료되며, 가장 크게 연결된 무리(화면 밖 연결 인정)를 만든 사람이 승리합니다.</li>
      </ul>
    </details>
  </div>
</div>

<script id="engine">
/* =====================================================================
   Gravity — 9x9 Torus Engine
   ===================================================================== */
const N=9, CELLS=81, MAX_PLIES=80;
const BLACK=1, WHITE=2;
const ADJ=[]; const RAYS=[]; 
const wrap = (x) => ((x % N) + N) % N;

(function(){
  const DIRS=[[-1,0],[1,0],[0,-1],[0,1]];
  for(let cell=0;cell<CELLS;cell++){
    const r=Math.floor(cell/N), c=cell%N; const adj=[], rays=[];
    for(const [dr,dc] of DIRS){
      adj.push(wrap(r+dr)*N + wrap(c+dc));
      const ray=[];
      for(let k=2;k<=4;k++){ ray.push(wrap(r+dr*k)*N + wrap(c+dc*k)); }
      rays.push(ray);
    }
    ADJ.push(adj); RAYS.push(rays);
  }
})();

function pullsFor(board, cell){
  const out=[];
  const r=Math.floor(cell/N), c=cell%N;
  const DIRS=[[-1,0],[1,0],[0,-1],[0,1]];
  for(let d=0; d<4; d++){
    const dr = DIRS[d][0], dc = DIRS[d][1];
    const a = ADJ[cell][d]; 
    if(board[a]!==0) continue;
    const ray = RAYS[cell][d];
    for(let i=0; i<ray.length; i++){
      const s = ray[i];
      if(board[s]!==0){
        out.push({
          from: s, to: a,
          dx: -dr * (i+1), // 시각적 이동량 (k-1)
          dy: -dc * (i+1)
        });
        break;
      }
    }
  }
  return out;
}

function applyMove(board, cell, player){
  board[cell]=player;
  const pulls = pullsFor(board, cell);
  for(const p of pulls){ board[p.to]=board[p.from]; board[p.from]=0; }
  return pulls;
}

const _seen=new Uint8Array(CELLS); const _stack=new Int8Array(CELLS);
function groupSizes(board, player){
  _seen.fill(0); const sizes=[];
  for(let i=0;i<CELLS;i++){
    if(board[i]!==player||_seen[i]) continue;
    let sz=0, sp=0; _stack[sp++]=i; _seen[i]=1;
    while(sp){
      const x=_stack[--sp]; sz++;
      const adj=ADJ[x];
      for(let d=0;d<4;d++){
        const y=adj[d];
        if(board[y]===player && !_seen[y]){ _seen[y]=1; _stack[sp++]=y; }
      }
    }
    sizes.push(sz);
  }
  sizes.sort((a,b)=>b-a);
  return sizes;
}

function finalWinner(board){
  const a=groupSizes(board,BLACK), b=groupSizes(board,WHITE);
  const n=Math.max(a.length,b.length);
  for(let i=0;i<n;i++){ const x=a[i]||0, y=b[i]||0; if(x!==y) return x>y?BLACK:WHITE; }
  return WHITE;
}

/* ---------------- MCTS ---------------- */
let _rs=0x2545F491;
function rnd(){_rs^=_rs<<13;_rs>>>=0;_rs^=_rs>>>17;_rs^=_rs<<5;_rs>>>=0;return _rs/4294967296;}
const _emp=new Int8Array(CELLS);
function rollout(board, plies, toMove){
  const b=board; let p=toMove;
  while(plies<MAX_PLIES){
    let n=0; for(let i=0;i<CELLS;i++) if(b[i]===0) _emp[n++]=i;
    applyMove(b, _emp[(rnd()*n)|0], p); plies++; p=3-p;
  }
  return finalWinner(b);
}

function mctsChoose(board, plies, toMove, opts){
  const iters=opts.iters, timeMs=opts.timeMs; const start=Date.now();
  const root={board, plies, mover:3-toMove, n:0, w:0, children:null, result:0};
  const scratch=new Int8Array(CELLS);
  function expand(node){
    const p=3-node.mover; const kids=[];
    for(let i=0;i<CELLS;i++){
      if(node.board[i]!==0) continue; 
      const nb=node.board.slice(); applyMove(nb,i,p);
      const ch={board:nb, plies:node.plies+1, mover:p, move:i, n:0, w:0, children:null, result:0, parent:node};
      if(ch.plies>=MAX_PLIES) ch.result=finalWinner(nb); kids.push(ch);
    }
    node.children=kids;
  }
  let it=0;
  for(;it<iters;it++){
    if((it&63)===0 && Date.now()-start>timeMs) break;
    let node=root;
    while(node.children && node.children.length && !node.result){
      let best=null, bv=-1; const ln=Math.log(node.n+1);
      for(const ch of node.children){ const v=ch.n===0?1e9+rnd():(ch.w/ch.n)+1.1*Math.sqrt(ln/ch.n); if(v>bv){bv=v; best=ch;} }
      node=best;
    }
    if(!node.result && !node.children && node.n>0) expand(node);
    if(node.children && node.children.length && !node.result) node=node.children[(rnd()*node.children.length)|0];
    let res = node.result;
    if(!res){ scratch.set(node.board); res=rollout(scratch, node.plies, 3-node.mover); }
    for(let cur=node; cur; cur=cur.parent){ cur.n++; if(res===cur.mover) cur.w++; }
  }
  if(!root.children) expand(root);
  const kids = root.children.slice().sort((a,b)=>b.n-a.n);
  let pick = kids[0];
  if(opts.topRandom && kids.length>1) pick = kids[(rnd()*Math.min(opts.topRandom, kids.length))|0];
  return {move: pick.move, iters: it, winrate: pick.n ? pick.w/pick.n : 0.5, ms: Date.now()-start};
}

const LEVELS = {
  '1': {iters: 200,    timeMs: 500, topRandom:3},
  '2': {iters: 2000,   timeMs: 1500},
  '3': {iters: 10000,  timeMs: 3000},
  '4': {iters: 150000, timeMs: 10000} // 최대 10초
};

/* ---------------- game state ---------------- */
function newGame(){ return {board:new Int8Array(CELLS), plies:0, toMove:BLACK, moves:[], result:null, stones:[], nextId:1}; }
function playMove(game, cell){
  const player = game.toMove;
  const pulls = pullsFor(game.board, cell);
  for(const p of pulls) { game.board[p.to]=game.board[p.from]; game.board[p.from]=0; }
  game.board[cell]=player;
  const rec = {cell, player, pulls};

  for(const p of pulls){
    const st = game.stones.find(s=>s.cell===p.from);
    if(st){
      st.cell = p.to;
      const fromX = p.from%N, fromY = Math.floor(p.from/N);
      const toX = p.to%N, toY = Math.floor(p.to/N);
      // 벽 관통 판정
      if(fromX + p.dx !== toX || fromY + p.dy !== toY) {
        st.isWrapping = true; st.cloneCreated = false;
        st.wrapStart = {x: fromX, y: fromY};
        st.wrapDx = p.dx; st.wrapDy = p.dy;
        st.wrapTo = {x: toX, y: toY};
      } else { st.isWrapping = false; }
    }
  }
  const stone = {id: game.nextId++, cell, color: player, isWrapping: false};
  game.stones.push(stone); rec.stoneId = stone.id;
  game.moves.push(rec); game.plies++; game.toMove = 3-player;
  
  if(game.plies>=MAX_PLIES) game.result = {winner: finalWinner(game.board)};
  return rec;
}
function clearClones() {
  document.querySelectorAll('.wrap-clone').forEach(el=>el.remove());
  game.stones.forEach(s => s.isWrapping = false);
}
function undoMove(game){
  const rec=game.moves.pop(); if(!rec) return false;
  game.board[rec.cell]=0;
  for(let i=rec.pulls.length-1;i>=0;i--){
    const p=rec.pulls[i]; game.board[p.from]=game.board[p.to]; game.board[p.to]=0;
    const st=game.stones.find(s=>s.cell===p.to); if(st) st.cell=p.from;
  }
  const idx=game.stones.findIndex(s=>s.id===rec.stoneId); if(idx>=0) game.stones.splice(idx,1);
  game.plies--; game.toMove=rec.player; game.result=null;
  clearClones();
  return true;
}
</script>

<script>
/* =====================================================================
   UI
   ===================================================================== */
const $ = id => document.getElementById(id);
let game = newGame();
let gameType = 'play', mode = 'ai', level = '2', humanColor = BLACK;
let selected = -1, thinking = false, lastPlayerWinRate = null, hintCell = -1;
const stoneEls = new Map();

function colorName(c){ return c===BLACK ? '흑' : '백'; }
function myTurn(){ return !game.result && !thinking && (mode==='local' || game.toMove===humanColor); }

/* ---------- board ---------- */
function buildGrid(){
  const grid=$('grid'); grid.innerHTML='';
  for(let cell=0;cell<CELLS;cell++){
    const d=document.createElement('div'); d.className='cell'; d.dataset.cell=cell;
    d.addEventListener('click',()=>onCell(cell));
    d.addEventListener('mouseenter',()=>{if(selected<0 && myTurn() && game.board[cell]===0) showPreview(cell);});
    d.addEventListener('mouseleave',()=>{if(selected<0) clearPreview();});
    grid.appendChild(d);
  }
}
const pos = cell => ({left:(cell%N)*100/N+'%', top:Math.floor(cell/N)*100/N+'%'});

function syncStones(){
  const layer=$('stones'); const live=new Set();
  const gb = groupSizes(game.board, BLACK), gw = groupSizes(game.board, WHITE);
  
  for(const s of game.stones){
    live.add(s.id); let el=stoneEls.get(s.id);
    if(!el){
      el=document.createElement('div'); el.className='stone '+(s.color===BLACK?'black':'white')+' new'; el.innerHTML='<div class="disc"></div>';
      const p=pos(s.cell); el.style.left=p.left; el.style.top=p.top; layer.appendChild(el); stoneEls.set(s.id,el);
      requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('new')));
    }
    
    // 벽 관통 애니메이션 처리
    if(s.isWrapping) {
      const targetX = s.wrapStart.x + s.wrapDx;
      const targetY = s.wrapStart.y + s.wrapDy;
      el.style.left = (targetX * 100 / N) + '%';
      el.style.top = (targetY * 100 / N) + '%';
      
      if(!s.cloneCreated) {
        s.cloneCreated = true;
        const clone = document.createElement('div');
        clone.className = 'stone ' + (s.color===BLACK?'black':'white') + ' wrap-clone';
        clone.innerHTML = '<div class="disc"></div>';
        
        const cloneStartX = s.wrapTo.x - s.wrapDx;
        const cloneStartY = s.wrapTo.y - s.wrapDy;
        clone.style.left = (cloneStartX * 100 / N) + '%';
        clone.style.top = (cloneStartY * 100 / N) + '%';
        
        layer.appendChild(clone);
        clone.offsetHeight; // Reflow
        
        clone.style.left = (s.wrapTo.x * 100 / N) + '%';
        clone.style.top = (s.wrapTo.y * 100 / N) + '%';
        
        setTimeout(() => {
          if(clone.parentNode) clone.remove();
          if(!s.isWrapping) return; 
          s.isWrapping = false; s.cloneCreated = false;
          el.style.transition = 'none';
          el.style.left = (s.wrapTo.x * 100 / N) + '%';
          el.style.top = (s.wrapTo.y * 100 / N) + '%';
          el.offsetHeight;
          el.style.transition = '';
        }, 380);
      }
    } else {
      const p = pos(s.cell);
      if(el.style.left!==p.left || el.style.top!==p.top) { el.style.left=p.left; el.style.top=p.top; }
    }
  }
  for(const [id,el] of stoneEls){ if(!live.has(id)){el.remove(); stoneEls.delete(id);} }
  
  document.querySelectorAll('.cell').forEach(c => {
    const cell = +c.dataset.cell;
    c.classList.toggle('empty', game.board[cell]===0 && !game.result);
    c.classList.toggle('hinted', cell === hintCell);
  });
  $('board').classList.toggle('over', !!game.result);
  return {gb, gw};
}

function showPreview(cell){
  clearPreview();
  const pulls = pullsFor(game.board, cell); const layer=$('ghosts');
  const g=document.createElement('div'); g.className='ghost '+(game.toMove===BLACK?'black':'white')+' place';
  const p=pos(cell); g.style.left=p.left; g.style.top=p.top; g.innerHTML='<div class="disc"></div>'; layer.appendChild(g);
  for(const pl of pulls){
    const st=game.stones.find(s=>s.cell===pl.from); if(!st) continue;
    const el=stoneEls.get(st.id); if(el) el.classList.add('will-move');
    const gh=document.createElement('div'); gh.className='ghost '+(st.color===BLACK?'black':'white');
    const q=pos(pl.to); gh.style.left=q.left; gh.style.top=q.top; gh.innerHTML='<div class="disc"></div>'; layer.appendChild(gh);
  }
}
function clearPreview(){ $('ghosts').innerHTML=''; stoneEls.forEach(el=>el.classList.remove('will-move')); }

function onCell(cell){
  if(!myTurn() || game.board[cell]!==0) return;
  if(selected===cell){ selected=-1; commit(cell); return; }
  selected = cell; showPreview(cell);
}

function commit(cell){
  clearPreview(); selected = -1; hintCell = -1;
  playMove(game, cell);
  render(); maybeAI();
}

function maybeAI(){
  if(mode!=='ai' || game.result || game.toMove===humanColor || thinking) return;
  thinking = true; renderPanel();
  setTimeout(() => {
    const r = mctsChoose(game.board, game.plies, game.toMove, LEVELS[level]);
    thinking = false;
    lastPlayerWinRate = Math.max(0, Math.min(100, 100 - Math.round(r.winrate * 100)));
    playMove(game, r.move);
    render();
  }, 50);
}

/* ---------- UI & Controls ---------- */
function render(){ const g=syncStones(); renderPanel(g); }
function renderPanel(g){
  if(!g) g = {gb:groupSizes(game.board,BLACK), gw:groupSizes(game.board,WHITE)};
  
  const tb = $('turnBox');
  if(game.result){
    const r = game.result;
    tb.textContent = r.resigned ? `${colorName(r.winner)} 승리 (기권)` : `${colorName(r.winner)} 승리`;
    tb.style.color = 'var(--amber)';
  } else {
    let who = game.toMove === BLACK ? '흑 차례' : '백 차례';
    if(mode==='ai') who += (game.toMove===humanColor) ? ' (내 차례)' : ' (AI 계산 중...)';
    tb.textContent = who;
    tb.style.color = 'var(--text)';
  }
  
  $('stonesPlaced').textContent = `진행도: ${game.plies} / ${MAX_PLIES}`;
  $('scoreB').textContent = g.gb[0] || 0;
  $('scoreW').textContent = g.gw[0] || 0;

  // 훈련 모드 전용 UI 처리
  const isTrain = (gameType === 'training');
  $('undoBtn').style.display = isTrain ? 'inline-block' : 'none';
  $('hintBtn').style.display = isTrain ? 'inline-block' : 'none';
  $('undoBtn').disabled = thinking || game.moves.length === 0;
  $('hintBtn').disabled = thinking || game.result || !myTurn();
  $('resignBtn').disabled = !!game.result;
  
  $('levelRow').style.display = mode === 'ai' ? 'flex' : 'none';
  $('colorRow').style.display = mode === 'ai' ? 'flex' : 'none';

  if(isTrain) {
    $('winRateBox').style.display = 'block';
    if(game.result) $('winRateBox').textContent = '-';
    else if(thinking) $('winRateBox').textContent = '계산 중...';
    else if(lastPlayerWinRate !== null) $('winRateBox').textContent = `예상 승률: ${lastPlayerWinRate}%`;
    else $('winRateBox').textContent = `예상 승률: -`;
  } else {
    $('winRateBox').style.display = 'none';
  }
}

function startGame(){
  game = newGame(); selected = -1; thinking = false; hintCell = -1;
  lastPlayerWinRate = (gameType === 'training' && mode === 'ai') ? 50 : null;
  stoneEls.forEach(el=>el.remove()); stoneEls.clear(); clearPreview();
  render(); maybeAI();
}

function undo(){
  if(thinking || gameType === 'play') return;
  undoMove(game);
  if(mode==='ai' && game.toMove!==humanColor && game.moves.length) undoMove(game);
  selected = -1; hintCell = -1; lastPlayerWinRate = null; clearPreview(); render();
}

function showHint(){
  if(thinking || game.result || !myTurn() || gameType === 'play') return;
  thinking = true;
  $('winRateBox').textContent = '최적의 수 탐색 중... (최대 10초)';
  $('hintBtn').disabled = true;
  
  setTimeout(() => {
    const r = mctsChoose(game.board, game.plies, game.toMove, LEVELS['4']);
    hintCell = r.move;
    thinking = false;
    lastPlayerWinRate = Math.round(r.winrate * 100);
    render();
  }, 50);
}

function resign(){
  if(game.result) return;
  if(confirm("기권하시겠습니까?")) {
    game.result = { winner: 3 - game.toMove, resigned: true };
    render();
  }
}

function seg(id, onPick){
  const el = $(id);
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    onPick(b.dataset.v);
  }));
}

seg('typeSeg', v => { gameType = v; lastPlayerWinRate = null; hintCell = -1; renderPanel(); });
seg('modeSeg', v => { mode = v; startGame(); });
seg('levelSeg', v => { level = v; });
seg('colorSeg', v => { humanColor = Number(v); startGame(); });

$('newBtn').addEventListener('click', startGame);
$('undoBtn').addEventListener('click', undo);
$('hintBtn').addEventListener('click', showHint);
$('resignBtn').addEventListener('click', resign);

buildGrid();
startGame();
</script>
</body>
</html>
