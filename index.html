<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity</title>
<style>
  :root {
    --bg: #050505; 
    --panel: #111; 
    --text: #eee; 
    --muted: #888;
    --board: #151515; 
    --line: #2a2a2a;
    --stone-b: #000; 
    --stone-w: #ddd;
    --accent: #E3B04B; 
  }
  
  * { box-sizing: border-box; }
  body { 
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  button { font: inherit; color: inherit; cursor: pointer; outline: none; }
  
  .app { max-width: 860px; margin: 0 auto; padding: 40px 20px; display: flex; flex-wrap: wrap; gap: 40px; }
  .board-col { flex: 1; min-width: 320px; display: flex; flex-direction: column; gap: 12px; }
  .panel-col { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 24px; }
  
  .header { display: flex; justify-content: space-between; align-items: flex-end; }
  .title { margin: 0; font-size: 36px; font-weight: 800; letter-spacing: 1px; color: #fff; }
  
  /* 상태 및 승률 표시 */
  .status-box { display: flex; justify-content: space-between; align-items: center; }
  .turn-text { font-size: 20px; font-weight: bold; }
  .winrate-text { font-size: 16px; font-weight: 600; color: var(--accent); min-height: 24px; }
  
  /* 9x9 보드 */
  .board {
    position: relative; width: 100%; aspect-ratio: 1; 
    background: var(--board); border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
  }
  .grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); }
  .cell { border: 1px solid var(--line); position: relative; }
  .cell.empty { cursor: pointer; }
  .cell.empty:hover { background: rgba(255,255,255,0.06); }
  .cell.hinted { background: rgba(227,176,75,0.25); box-shadow: inset 0 0 0 2px var(--accent); }
  .board.over .cell { cursor: default; }
  
  .layer { position: absolute; inset: 0; pointer-events: none; }
  
  /* 돌 및 애니메이션 */
  .stone, .ghost, .clone {
    position: absolute; width: 11.1111%; height: 11.1111%; display: flex; align-items: center; justify-content: center;
    transition: left .35s cubic-bezier(.2,.8,.2,1), top .35s cubic-bezier(.2,.8,.2,1);
  }
  .clone { z-index: 5; } /* 벽 관통용 복제 돌 */
  
  .disc { width: 78%; height: 78%; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.8); }
  .stone.black .disc, .clone.black .disc { background: linear-gradient(135deg, #333, #000); border: 1px solid #222; }
  .stone.white .disc, .clone.white .disc { background: linear-gradient(135deg, #fff, #bbb); border: 1px solid #999; }
  .stone.new .disc { animation: popIn 0.3s forwards; }
  @keyframes popIn { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  
  .ghost .disc { opacity: 0.3; }
  .ghost.black .disc { background: var(--stone-b); } 
  .ghost.white .disc { background: var(--stone-w); }
  .ghost.place .disc { opacity: 0.7; box-shadow: 0 0 0 2px var(--accent); }
  .stone.will-move .disc { opacity: 0.5; transform: scale(0.9); }
  
  /* 컨트롤 패널 */
  .control-group { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .control-group .label { width: 70px; font-size: 14px; color: var(--muted); }
  
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: #000; }
  .seg button { background: transparent; border: 0; padding: 8px 14px; font-size: 14px; color: #777; font-weight: 500; }
  .seg button:not(:first-child) { border-left: 1px solid var(--line); }
  .seg button.on { background: #333; color: #fff; font-weight: bold; }
  
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .btn { background: #1a1a1a; border: 1px solid var(--line); color: #ddd; padding: 12px; border-radius: 4px; font-size: 15px; font-weight: 600; transition: background 0.2s; }
  .btn:hover:not(:disabled) { background: #2a2a2a; }
  .btn.primary { background: #ddd; color: #000; border-color: #ddd; }
  .btn.primary:hover:not(:disabled) { background: #fff; }
  .btn:disabled { opacity: 0.3; cursor: default; }

  /* 무리 크기 및 규칙 */
  .score-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; justify-content: space-around; }
  .score-item { text-align: center; }
  .score-item span { display: block; font-size: 28px; font-weight: 800; margin-top: 4px; }
  
  .rules { font-size: 13px; color: var(--muted); background: var(--panel); padding: 16px; border-radius: 6px; border: 1px solid var(--line); }
  .rules p { margin: 0 0 8px 0; font-weight: bold; color: #ccc; }
  .rules ul { margin: 0; padding-left: 20px; }
  .rules li { margin-bottom: 4px; }

  /* 훈련 모드 UI 요소 제어 */
  body.play-mode .train-only { display: none !important; }
</style>
</head>
<body class="play-mode">
<div class="app">
  <!-- 좌측: 보드 영역 -->
  <div class="board-col">
    <div class="header">
      <h1 class="title">Gravity</h1>
      <div id="placedCount" style="color:var(--muted); font-size:14px;">0 / 80</div>
    </div>
    
    <div class="status-box">
      <div id="turnBox" class="turn-text">흑 차례</div>
      <div id="winrateBox" class="winrate-text train-only">예상 승률: -</div>
    </div>
    
    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="layer" id="ghosts"></div>
      <div class="layer" id="stones"></div>
    </div>
  </div>

  <!-- 우측: 패널 영역 -->
  <div class="panel-col">
    <div class="score-card">
      <div class="score-item" style="color: #fff;">흑 최대 무리 <span id="scoreB">0</span></div>
      <div class="score-item" style="color: #aaa;">백 최대 무리 <span id="scoreW">0</span></div>
    </div>

    <div>
      <div class="control-group">
        <div class="label">진행 모드</div>
        <div class="seg" id="typeSeg">
          <button data-v="play" class="on">플레이</button>
          <button data-v="train">훈련</button>
        </div>
      </div>
      <div class="control-group">
        <div class="label">상대</div>
        <div class="seg" id="modeSeg">
          <button data-v="ai" class="on">AI</button>
          <button data-v="local">2인</button>
        </div>
      </div>
      <div class="control-group" id="levelRow">
        <div class="label">AI 단계</div>
        <div class="seg" id="levelSeg">
          <button data-v="1">1</button>
          <button data-v="2" class="on">2</button>
          <button data-v="3">3</button>
          <button data-v="4">4</button>
        </div>
      </div>
      <div class="control-group" id="colorRow">
        <div class="label">내 돌</div>
        <div class="seg" id="colorSeg">
          <button data-v="1" class="on">흑(선공)</button>
          <button data-v="2">백(후공)</button>
        </div>
      </div>
    </div>

    <div class="action-grid">
      <button class="btn primary" id="newBtn">새 게임</button>
      <button class="btn" id="resignBtn">기권</button>
      <button class="btn train-only" id="undoBtn">무르기</button>
      <button class="btn train-only" id="hintBtn">힌트 보기</button>
    </div>

    <div class="rules">
      <p>9x9 환상형(Torus) 규칙</p>
      <ul>
        <li>보드의 끝은 반대편 끝과 연결되어 있습니다. (중앙/구석 없음)</li>
        <li>돌을 놓으면 상하좌우(화면 밖 연결 포함) 가장 가까운 돌이 끌려옵니다.</li>
        <li>가장 큰 무리를 만든 사람이 승리하며, 동점 시 백(후공)이 승리합니다.</li>
        <li><b>플레이 모드</b>: 실전 모드입니다.</li>
        <li><b>훈련 모드</b>: 내 예상 승률을 실시간으로 확인하고 무르기/힌트를 사용할 수 있습니다.</li>
      </ul>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   Gravity Engine (9x9 Torus, MCTS AI, Rules)
   ===================================================================== */
const N=9, CELLS=81, MAX_PLIES=80;
const BLACK=1, WHITE=2;
const ADJ=[], RAYS=[];
const wrap = (x) => ((x % N) + N) % N;

// 보드 기하학(Torus) 초기화
for(let cell=0; cell<CELLS; cell++){
  const r=Math.floor(cell/N), c=cell%N; const adj=[], rays=[];
  const DIRS=[[-1,0],[1,0],[0,-1],[0,1]];
  for(const [dr,dc] of DIRS){
    adj.push(wrap(r+dr)*N + wrap(c+dc));
    const ray=[];
    for(let k=2; k<=4; k++){ ray.push(wrap(r+dr*k)*N + wrap(c+dc*k)); }
    rays.push(ray);
  }
  ADJ.push(adj); RAYS.push(rays);
}

// 중력으로 끌려오는 돌 계산 (dx, dy는 시각적 애니메이션 처리를 위함)
function pullsFor(board, cell){
  const out=[];
  const DIRS=[[-1,0],[1,0],[0,-1],[0,1]];
  for(let d=0; d<4; d++){
    const a = ADJ[cell][d]; 
    if(board[a]!==0) continue; // 바로 옆이 막혀있으면 끌어오지 않음
    const ray = RAYS[cell][d];
    for(let i=0; i<ray.length; i++){
      const s = ray[i];
      if(board[s]!==0){
        out.push({ from: s, to: a, dx: -DIRS[d][0] * (i+1), dy: -DIRS[d][1] * (i+1) });
        break;
      }
    }
  }
  return out;
}

function applyMove(board, cell, player){
  board[cell] = player;
  const pulls = pullsFor(board, cell);
  for(const p of pulls){ board[p.to] = board[p.from]; board[p.from] = 0; }
  return pulls;
}

// 가장 큰 무리 크기 계산 (BFS)
const _seen = new Uint8Array(CELLS), _stack = new Int8Array(CELLS);
function groupSizes(board, player){
  _seen.fill(0); const sizes=[];
  for(let i=0; i<CELLS; i++){
    if(board[i]!==player || _seen[i]) continue;
    let sz=0, sp=0; _stack[sp++]=i; _seen[i]=1;
    while(sp){
      const x = _stack[--sp]; sz++;
      for(let d=0; d<4; d++){
        const y = ADJ[x][d];
        if(board[y]===player && !_seen[y]){ _seen[y]=1; _stack[sp++]=y; }
      }
    }
    sizes.push(sz);
  }
  return sizes.sort((a,b)=>b-a);
}

function finalWinner(board){
  const a=groupSizes(board,BLACK), b=groupSizes(board,WHITE);
  const n=Math.max(a.length,b.length);
  for(let i=0; i<n; i++){ const x=a[i]||0, y=b[i]||0; if(x!==y) return x>y ? BLACK : WHITE; }
  return WHITE;
}

/* =====================================================================
   MCTS AI 알고리즘
   ===================================================================== */
let _rs = 0x2545F491;
function rnd(){ _rs^=_rs<<13; _rs>>>=0; _rs^=_rs>>>17; _rs^=_rs<<5; _rs>>>=0; return _rs/4294967296; }
const _emp = new Int8Array(CELLS);

function rollout(board, plies, toMove){
  const b = board.slice(); let p = toMove;
  while(plies < MAX_PLIES){
    let n=0; for(let i=0; i<CELLS; i++) if(b[i]===0) _emp[n++]=i;
    applyMove(b, _emp[(rnd()*n)|0], p); plies++; p=3-p;
  }
  return finalWinner(b);
}

function mctsChoose(board, plies, toMove, opts){
  const iters = opts.iters, timeMs = opts.timeMs; const start = Date.now();
  const root = {board, plies, mover: 3-toMove, n:0, w:0, children:null, result:0};
  const scratch = new Int8Array(CELLS);
  
  function expand(node){
    const p = 3-node.mover; const kids = [];
    for(let i=0; i<CELLS; i++){
      if(node.board[i]!==0) continue; 
      const nb = node.board.slice(); applyMove(nb, i, p);
      const ch = {board:nb, plies:node.plies+1, mover:p, move:i, n:0, w:0, children:null, result:0, parent:node};
      if(ch.plies >= MAX_PLIES) ch.result = finalWinner(nb);
      kids.push(ch);
    }
    node.children = kids;
  }
  
  let it = 0;
  for(; it<iters; it++){
    if((it&63)===0 && Date.now()-start > timeMs) break;
    let node = root;
    while(node.children && node.children.length && !node.result){
      let best = null, bv = -1; const ln = Math.log(node.n+1);
      for(const ch of node.children){ 
        const v = ch.n===0 ? 1e9+rnd() : (ch.w/ch.n) + 1.1*Math.sqrt(ln/ch.n); 
        if(v>bv){ bv=v; best=ch; } 
      }
      node = best;
    }
    if(!node.result && !node.children && node.n>0) expand(node);
    if(node.children && node.children.length && !node.result) node = node.children[(rnd()*node.children.length)|0];
    
    let res = node.result;
    if(!res){ scratch.set(node.board); res = rollout(scratch, node.plies, 3-node.mover); }
    for(let cur=node; cur; cur=cur.parent){ cur.n++; if(res===cur.mover) cur.w++; }
  }
  
  if(!root.children) expand(root);
  const kids = root.children.slice().sort((a,b) => b.n - a.n);
  // 탐색 횟수가 적은 1단계 AI를 위해 약간의 랜덤성 부여
  let pick = kids[0];
  if(opts.topRandom && kids.length > 1) pick = kids[(rnd() * Math.min(opts.topRandom, kids.length))|0];
  
  return {move: pick.move, winrate: pick.n ? pick.w/pick.n : 0.5};
}

const LEVELS = {
  '1': {iters: 100,    timeMs: 300, topRandom: 4}, // 가장 쉬움
  '2': {iters: 2000,   timeMs: 1500},
  '3': {iters: 15000,  timeMs: 3000},
  '4': {iters: 100000, timeMs: 6000} // 가장 어려움, 최대 6초
};


/* =====================================================================
   게임 상태 및 UI 로직
   ===================================================================== */
const $ = id => document.getElementById(id);
let game, selected = -1, hintCell = -1;
let thinking = false, lastPlayerWinRate = null;
let gameType = 'play', mode = 'ai', level = '2', humanColor = BLACK;
const stoneEls = new Map();

function newGame(){ return {board:new Int8Array(CELLS), plies:0, toMove:BLACK, moves:[], result:null, stones:[], nextId:1}; }

function playMove(game, cell){
  const player = game.toMove;
  const pulls = pullsFor(game.board, cell);
  for(const p of pulls){ game.board[p.to]=game.board[p.from]; game.board[p.from]=0; }
  game.board[cell] = player;
  
  const rec = {cell, player, pulls};
  
  // 시각적 돌(Stone) 객체 갱신 및 벽 관통(Torus) 감지
  for(const p of pulls){
    const st = game.stones.find(s => s.cell === p.from);
    if(st){
      st.cell = p.to;
      const fromX = p.from % N, fromY = Math.floor(p.from / N);
      const toX = p.to % N, toY = Math.floor(p.to / N);
      if(fromX + p.dx !== toX || fromY + p.dy !== toY) {
        st.wrap = { startX: fromX, startY: fromY, dx: p.dx, dy: p.dy, toX: toX, toY: toY };
      } else {
        st.wrap = null;
      }
    }
  }
  
  const stone = {id: game.nextId++, cell, color: player, wrap: null};
  game.stones.push(stone); rec.stoneId = stone.id;
  game.moves.push(rec); game.plies++; game.toMove = 3-player;
  if(game.plies >= MAX_PLIES) game.result = {winner: finalWinner(game.board), resigned: false};
}

function undoMove(game){
  const rec = game.moves.pop(); if(!rec) return;
  game.board[rec.cell] = 0;
  for(let i = rec.pulls.length-1; i>=0; i--){
    const p = rec.pulls[i]; 
    game.board[p.from] = game.board[p.to]; game.board[p.to] = 0;
    const st = game.stones.find(s => s.cell === p.to); if(st) { st.cell = p.from; st.wrap = null; }
  }
  const idx = game.stones.findIndex(s => s.id === rec.stoneId); 
  if(idx >= 0) game.stones.splice(idx,1);
  game.plies--; game.toMove = rec.player; game.result = null;
  document.querySelectorAll('.clone').forEach(e => e.remove()); // 남은 애니메이션 클론 청소
}

function myTurn(){ return !game.result && !thinking && (mode==='local' || game.toMove===humanColor); }

// DOM Grid 초기화
const grid = $('grid');
for(let i=0; i<CELLS; i++){
  const d = document.createElement('div'); d.className = 'cell'; d.dataset.cell = i;
  d.addEventListener('click', () => {
    if(!myTurn() || game.board[i]!==0) return;
    if(selected===i){ selected=-1; commit(i); } else { selected=i; showPreview(i); }
  });
  d.addEventListener('mouseenter', () => { if(selected<0 && myTurn() && game.board[i]===0) showPreview(i); });
  d.addEventListener('mouseleave', () => { if(selected<0) clearPreview(); });
  grid.appendChild(d);
}

// 프리뷰 및 렌더링
function showPreview(cell){
  clearPreview();
  const pulls = pullsFor(game.board, cell); const layer=$('ghosts');
  const g = document.createElement('div'); g.className = 'ghost place ' + (game.toMove===BLACK?'black':'white');
  g.style.left = (cell%N)*100/N+'%'; g.style.top = Math.floor(cell/N)*100/N+'%'; g.innerHTML = '<div class="disc"></div>'; layer.appendChild(g);
  
  for(const pl of pulls){
    const st = game.stones.find(s => s.cell === pl.from); if(!st) continue;
    const el = stoneEls.get(st.id); if(el) el.classList.add('will-move');
    const gh = document.createElement('div'); gh.className = 'ghost ' + (st.color===BLACK?'black':'white');
    gh.style.left = (pl.to%N)*100/N+'%'; gh.style.top = Math.floor(pl.to/N)*100/N+'%'; gh.innerHTML = '<div class="disc"></div>'; layer.appendChild(gh);
  }
}
function clearPreview(){ $('ghosts').innerHTML=''; stoneEls.forEach(el=>el.classList.remove('will-move')); }

function commit(cell){
  clearPreview(); selected = -1; hintCell = -1;
  playMove(game, cell);
  render(); maybeAI();
}

// 화면 동기화 (Torus 애니메이션 포함)
function syncStones(){
  const layer = $('stones'); const live = new Set();
  
  for(const s of game.stones){
    live.add(s.id); let el = stoneEls.get(s.id);
    if(!el){
      el = document.createElement('div'); el.className = 'stone new '+(s.color===1?'black':'white'); el.innerHTML='<div class="disc"></div>';
      el.style.left = (s.cell%N)*100/N+'%'; el.style.top = Math.floor(s.cell/N)*100/N+'%'; layer.appendChild(el); stoneEls.set(s.id, el);
      requestAnimationFrame(() => el.classList.remove('new'));
    }
    
    // 벽 관통(Torus) 애니메이션 처리
    if(s.wrap){
      // 1. 원본 돌을 화면 밖 물리적 위치로 이동
      el.style.left = (s.wrap.startX + s.wrap.dx)*100/N + '%';
      el.style.top = (s.wrap.startY + s.wrap.dy)*100/N + '%';
      
      if(!s.cloneHandled){
        s.cloneHandled = true;
        // 2. 반대편 화면 밖에서 날아오는 복제본(Clone) 생성
        const clone = document.createElement('div');
        clone.className = 'clone ' + (s.color===1?'black':'white'); clone.innerHTML = '<div class="disc"></div>';
        clone.style.left = (s.wrap.toX - s.wrap.dx)*100/N + '%';
        clone.style.top = (s.wrap.toY - s.wrap.dy)*100/N + '%';
        layer.appendChild(clone);
        
        clone.offsetHeight; // Reflow 강제
        // 3. 복제본을 최종 위치로 이동
        clone.style.left = (s.wrap.toX)*100/N + '%';
        clone.style.top = (s.wrap.toY)*100/N + '%';
        
        setTimeout(() => {
          clone.remove(); s.wrap = null; s.cloneHandled = false;
          el.style.transition = 'none'; // 애니메이션 없이 순간이동
          el.style.left = (s.cell%N)*100/N + '%';
          el.style.top = Math.floor(s.cell/N)*100/N + '%';
          el.offsetHeight;
          el.style.transition = ''; // 복구
        }, 350);
      }
    } else {
      el.style.left = (s.cell%N)*100/N + '%';
      el.style.top = Math.floor(s.cell/N)*100/N + '%';
    }
    el.classList.remove('will-move');
  }
  
  for(const [id, el] of stoneEls){ if(!live.has(id)){ el.remove(); stoneEls.delete(id); } }
  
  document.querySelectorAll('.cell').forEach((c, i) => {
    c.classList.toggle('empty', game.board[i]===0 && !game.result);
    c.classList.toggle('hinted', i === hintCell);
  });
  $('board').classList.toggle('over', !!game.result);
}

function render(){
  syncStones();
  
  // 상태 텍스트
  if(game.result){
    const winnerName = game.result.winner === BLACK ? '흑' : '백';
    $('turnBox').textContent = game.result.resigned ? `${winnerName} 승리 (기권)` : `${winnerName} 승리!`;
    $('turnBox').style.color = 'var(--accent)';
    $('winrateBox').textContent = '-';
  } else {
    $('turnBox').textContent = (game.toMove===BLACK ? '흑' : '백') + ' 차례';
    $('turnBox').style.color = '#fff';
    
    if(gameType === 'train'){
      if(thinking) $('winrateBox').textContent = '계산 중...';
      else if(lastPlayerWinRate !== null) $('winrateBox').textContent = `내 예상 승률: ${lastPlayerWinRate}%`;
      else $('winrateBox').textContent = `내 예상 승률: -`;
    }
  }
  
  $('placedCount').textContent = `${game.plies} / 80`;
  const gb = groupSizes(game.board, BLACK), gw = groupSizes(game.board, WHITE);
  $('scoreB').textContent = gb[0] || 0;
  $('scoreW').textContent = gw[0] || 0;

  // 버튼 활성화 상태
  $('undoBtn').disabled = thinking || game.moves.length === 0;
  $('hintBtn').disabled = thinking || game.result || !myTurn();
  $('resignBtn').disabled = !!game.result;
  $('levelRow').style.display = mode === 'ai' ? 'flex' : 'none';
  $('colorRow').style.display = mode === 'ai' ? 'flex' : 'none';
}

function maybeAI(){
  if(mode!=='ai' || game.result || game.toMove===humanColor || thinking) return;
  thinking = true; render();
  
  setTimeout(() => {
    const r = mctsChoose(game.board, game.plies, game.toMove, LEVELS[level]);
    thinking = false;
    // AI의 승률이 r.winrate 이므로, 플레이어의 승률은 (1 - r.winrate)
    lastPlayerWinRate = Math.max(0, Math.min(100, Math.round((1 - r.winrate) * 100)));
    playMove(game, r.move);
    render();
  }, 50);
}

// 훈련 모드 힌트 보기 (가장 어려운 4단계 AI가 플레이어 대신 수를 찾아줌)
function showHint(){
  if(thinking || game.result || !myTurn() || gameType === 'play') return;
  thinking = true; $('winrateBox').textContent = '최적의 수 찾는 중...'; render();
  
  setTimeout(() => {
    const r = mctsChoose(game.board, game.plies, game.toMove, LEVELS['4']);
    hintCell = r.move;
    thinking = false;
    // 이 때는 플레이어 입장에서 찾은 것이므로 r.winrate 가 플레이어 승률
    lastPlayerWinRate = Math.round(r.winrate * 100);
    render();
  }, 50);
}

function startGame(){
  game = newGame(); selected = -1; hintCell = -1; thinking = false; lastPlayerWinRate = null;
  stoneEls.forEach(el=>el.remove()); stoneEls.clear(); clearPreview();
  render(); maybeAI();
}

function undo(){
  if(thinking || gameType === 'play' || game.moves.length === 0) return;
  undoMove(game);
  if(mode==='ai' && game.toMove!==humanColor && game.moves.length) undoMove(game); // AI턴도 같이 무르기
  selected = -1; hintCell = -1; lastPlayerWinRate = null; clearPreview(); render();
}

function resign(){
  if(game.result) return;
  if(confirm("기권하시겠습니까?")){ game.result = { winner: 3 - game.toMove, resigned: true }; render(); }
}

// UI 이벤트 리스너 바인딩
function bindSeg(id, onPick){
  const el = $(id);
  el.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
    onPick(btn.dataset.v);
  }));
}

bindSeg('typeSeg', v => { 
  gameType = v; 
  document.body.className = v + '-mode'; 
  lastPlayerWinRate = null; hintCell = -1; render(); 
});
bindSeg('modeSeg', v => { mode = v; startGame(); });
bindSeg('levelSeg', v => { level = v; });
bindSeg('colorSeg', v => { humanColor = Number(v); startGame(); });

$('newBtn').addEventListener('click', startGame);
$('undoBtn').addEventListener('click', undo);
$('hintBtn').addEventListener('click', showHint);
$('resignBtn').addEventListener('click', resign);

// 게임 시작
startGame();

</script>
</body>
</html>
